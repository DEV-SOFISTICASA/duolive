<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuoLive · Painel completo</title>
<script>
  // modo claro/escuro: aplica ANTES de renderizar (sem flash), nos iframes SEM
  // recarregar (NAO desloga mais) e lembra a escolha POR USUARIO.
  try{ if(localStorage.getItem('ldTema')==='claro') document.documentElement.setAttribute('data-tema','claro'); }catch(e){}
  function aplicaTema(t){
    var set=function(doc){ if(!doc) return; if(t==='claro') doc.documentElement.setAttribute('data-tema','claro'); else doc.documentElement.removeAttribute('data-tema'); };
    set(document);
    document.querySelectorAll('iframe').forEach(function(f){ try{ set(f.contentDocument); }catch(e){} });
  }
  // quando o painel descobre quem logou (no /eu), aplica o tema salvo DAQUELA pessoa
  function temaDoUsuario(sigla){
    window.__sigla = sigla || '';
    try{ var t=localStorage.getItem('tema_'+sigla); if(t){ localStorage.setItem('ldTema',t); aplicaTema(t); } }catch(e){}
  }
  function alternaTema(){
    var t = (document.documentElement.getAttribute('data-tema')==='claro') ? 'escuro' : 'claro';
    try{ localStorage.setItem('ldTema', t); if(window.__sigla) localStorage.setItem('tema_'+window.__sigla, t); }catch(e){}
    aplicaTema(t); // aplica direto, SEM location.reload() -> nao dispara o F5-logout
  }
</script>
<style>
  :root{--bg:#0d0d10;--card:#16161b;--line:#26262e;--text:#ececf1;--text-2:#a3a3ad;--text-3:#737373;--accent:#ff5c35}
  :root[data-tema=claro]{--bg:#f4f4f6;--card:#ffffff;--line:#e4e4ea;--text:#1a1a20;--text-2:#5c5c68;--text-3:#8b8b95}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);overflow:hidden;display:flex;flex-direction:column}
  /* seletor de lojas (dropdown) — um botao que abre a lista */
  .barraLojas{display:flex;align-items:center;gap:8px;padding:6px 8px;border-bottom:1px solid var(--line);flex:none;font:12px -apple-system,'Segoe UI',Roboto,Arial,sans-serif;position:relative}
  .barraLojas .titulo{color:var(--text-3);font-size:11px;flex:none}
  #btnLoja{display:inline-flex;align-items:center;gap:8px;padding:5px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--text);cursor:pointer;font-size:12.5px;min-width:180px}
  #btnLoja .nome{font-weight:600}
  #btnLoja .tt{font-size:10.5px;color:var(--text-3)}
  #btnLoja .seta{margin-left:auto;color:var(--text-3);font-size:10px}
  #menuLojas{position:absolute;top:40px;left:8px;z-index:40;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:5px;min-width:230px;max-height:60vh;overflow-y:auto;box-shadow:0 10px 30px rgba(0,0,0,.5);display:none}
  #menuLojas.aberto{display:block}
  #menuLojas .item{display:flex;align-items:center;gap:8px;padding:7px 9px;border-radius:7px;color:var(--text-2);cursor:pointer;white-space:nowrap}
  #menuLojas .item:hover{background:var(--card-2,#1d1d24)}
  #menuLojas .item.on{color:#fff;background:rgba(255,92,53,.15)}
  #menuLojas .item .nome{flex:1}
  #menuLojas .item .tt{font-size:10.5px;color:var(--text-3)}
  #menuLojas .item .ed{opacity:.5;font-size:11px;padding:0 3px}
  #menuLojas .item:hover .ed{opacity:1}
  #menuLojas .add{color:var(--text-3);border-top:1px solid var(--line);margin-top:4px;padding:8px 9px;cursor:pointer;font-size:12px}
  #menuLojas .add:hover{color:var(--text)}
  /* o template do desenho: esquerda = Analytics em cima + Ofertas embaixo; direita = Multichat inteiro */
  .grade{display:grid;flex:1;min-height:0;gap:0;padding:6px;grid-template-columns:minmax(300px,var(--esq,46%)) 10px 1fr}
  .esq{display:grid;gap:6px;grid-template-rows:46% 1fr;min-width:0}  /* Analytics em cima, Ofertas embaixo */
  /* a barrinha do meio: segure e arraste para aumentar/diminuir o Multichat
     (2 cliques rápidos voltam ao tamanho padrão) */
  #divisor{cursor:col-resize;display:flex;align-items:center;justify-content:center;border-radius:6px;touch-action:none}
  #divisor::before{content:'';width:5px;height:72px;border-radius:99px;background:var(--line);transition:background .15s,height .15s}
  #divisor:hover::before,body.arrastando #divisor::before{background:var(--accent);height:110px}
  body.arrastando{cursor:col-resize;user-select:none}
  body.arrastando iframe{pointer-events:none}
  .caixa{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);min-height:0}
  .caixa iframe{width:100%;height:100%;border:0;display:block;background:var(--bg)}
  .rotulo{position:absolute;top:6px;right:8px;font:10px -apple-system,'Segoe UI',Roboto,Arial,sans-serif;color:var(--text-3);background:rgba(13,13,16,.7);padding:2px 8px;border-radius:99px;pointer-events:none}
  #semConector{position:absolute;inset:0;display:none;align-items:center;justify-content:center;padding:20px;text-align:center;background:var(--card);color:var(--text-2);font:13px/1.8 -apple-system,'Segoe UI',Roboto,Arial,sans-serif}
  #semConector code{font-family:ui-monospace,Consolas,monospace;background:#1d1d24;border:1px solid var(--line);border-radius:5px;padding:1px 6px;font-size:11.5px;color:var(--text)}
  #btnCfg{position:absolute;top:4px;right:6px;z-index:5;background:rgba(13,13,16,.7);border:1px solid var(--line);color:var(--text-3);border-radius:6px;font-size:12px;cursor:pointer;padding:2px 6px}
  #btnCfg:hover{color:var(--text)}
  /* celular/tablet: os tres painéis empilhados, cada um com altura própria e a
     página rolando (sem isso eles ficavam espremidos e cortados) */
  @media(max-width:760px){
    body{overflow:auto}
    .grade{display:block;padding:6px;min-height:0}
    .esq{display:block}
    .caixa{height:72vh;min-height:340px;margin-bottom:8px}
    .caixa:last-child{margin-bottom:0}
    #divisor{display:none}
  }
</style>
</head>
<body>
  <div class="barraLojas" id="barraLojas">
    <span class="titulo">🏪 Loja:</span>
    <button id="btnLoja">
      <span class="nome" id="lojaNome">escolher…</span>
      <span class="tt" id="lojaTT"></span>
      <span class="seta">▼</span>
    </button>
    <div id="menuLojas"></div>
    <button id="btnTema" onclick="alternaTema()" title="Alternar claro/escuro" style="margin-left:auto;background:var(--card);border:1px solid var(--line);color:var(--text-2);border-radius:7px;padding:4px 9px;cursor:pointer;font-size:14px;line-height:1">🌗</button>
    <span id="euBar" style="margin-left:10px;display:none;align-items:center;gap:9px;font-size:12px;color:var(--text-2)">
      <a href="/historico" target="_blank" style="color:var(--text-2);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px">📈 Histórico</a>
      <span>👤 <b id="euBarNome" style="color:var(--text)"></b></span>
      <a href="/sair" style="color:var(--text-2);text-decoration:none;border:1px solid var(--line);border-radius:7px;padding:4px 10px">Sair</a>
    </span>
  </div>
  <div class="grade">
    <div class="esq">
      <div class="caixa"><span class="rotulo">Analytics</span><iframe src="analytics.html" title="Analytics"></iframe></div>
      <div class="caixa"><span class="rotulo">Ofertas</span><iframe src="sacolinha-controle.html" title="Ofertas"></iframe></div>
    </div>
    <div id="divisor" title="Arraste para aumentar/diminuir o Multichat · 2 cliques: tamanho padrão"></div>
    <div class="caixa">
      <span class="rotulo">Multichat</span>
      <button id="btnCfg" title="Endereço do conector">⚙</button>
      <iframe id="mc" title="Multichat"></iframe>
      <div id="semConector">
        <div>
          <b style="color:var(--text)">💬 O Multichat abre aqui quando o conector estiver ligado.</b><br>
          <span id="dicaLocal">No seu PC (pasta <code>conector</code>): <code>npm start -- @seuusuario</code></span><br>
          <span style="color:var(--text-3);font-size:11.5px">Usando na nuvem? Clique no ⚙ e cole o endereço do seu servidor (Render).</span>
        </div>
      </div>
    </div>
  </div>
<script>
(function(){
  // F5 / reiniciar a página = sair (na nuvem, cada abertura pede login de novo).
  // No PC local (127.0.0.1 / rede interna) não desloga, pra não atrapalhar você.
  try{
    var _nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0]);
    var _recarregou=_nav?(_nav.type==='reload'):(performance.navigation&&performance.navigation.type===1);
    var _naNuvem=!/^(localhost$|127\.|0\.0\.0\.0|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
    if(_recarregou && _naNuvem){ location.replace('/sair'); return; }
  }catch(e){}
  // Endereco do conector: se o painel foi aberto PELO conector (PC ou Render),
  // usa o proprio endereco da pagina — tudo junto numa URL so'. Abriu como
  // arquivo? Usa o PC (127.0.0.1). Da' para trocar pelo ⚙ ou pela URL: ?api=...
  function apiBase(){
    try{
      var q=new URLSearchParams(location.search).get('api');
      if(q){ localStorage.setItem('ld-api', q); }
      var padrao=(location.protocol==='http:'||location.protocol==='https:')?location.origin:'http://127.0.0.1:9797';
      return localStorage.getItem('ld-api') || padrao;
    }catch(e){ return 'http://127.0.0.1:9797'; }
  }
  var URL_MC=apiBase().replace(/\/+$/,'');
  var mc=document.getElementById('mc'), aviso=document.getElementById('semConector');
  // o Multichat carrega DEPOIS (src setado abaixo); toda vez que ele (re)carrega,
  // reaplica o tema atual nele — senao ele pode abrir no tema errado (claro no escuro).
  mc.onload=function(){ try{ aplicaTema(document.documentElement.getAttribute('data-tema')==='claro'?'claro':'escuro'); }catch(e){} };
  var ligado=false;
  function confere(){
    var base=apiBase().replace(/\/+$/,'');
    if(base!==URL_MC){
      URL_MC=base; ligado=false; mc.removeAttribute('src');
      // trocou o endereco do conector: reenvia a conta da loja selecionada
      if(typeof lojaSel!=='undefined' && lojaSel){ try{ postConta(ttDe(lojaSel)); }catch(e){} }
    }
    fetch(URL_MC+'/', {mode:'no-cors', cache:'no-store'}).then(function(){
      if(!ligado){ ligado=true; mc.src=URL_MC+'/'+((typeof lojaSel!=='undefined'&&lojaSel)?'?loja='+encodeURIComponent(lojaSel):''); aviso.style.display='none'; }
      // o servidor reiniciou (deploy)? religa sozinho o chat da loja escolhida
      if(typeof lojaSel!=='undefined' && lojaSel && ttDe(lojaSel)){
        fetch(URL_MC+'/conta?loja='+encodeURIComponent(lojaSel),{cache:'no-store'}).then(function(r){return r.json();})
          .then(function(c){ if(c && !c.usuario) postConta(ttDe(lojaSel)); }).catch(function(){});
      }
    }).catch(function(){
      if(ligado||!mc.src){ ligado=false; mc.removeAttribute('src'); aviso.style.display='flex'; }
    });
    // passa endereco + loja selecionada para o Analytics (sem apagar o filtro)
    var af=document.querySelector('.esq .caixa iframe');
    if(af){
      var l=(typeof lojaSel!=='undefined' && lojaSel)?lojaSel:'';
      var novo='analytics.html?api='+encodeURIComponent(URL_MC)+(l?'&loja='+encodeURIComponent(l):'');
      if(af.getAttribute('src')!==novo) af.setAttribute('src', novo);
    }
  }
  document.getElementById('btnCfg').onclick=function(){
    var atual=localStorage.getItem('ld-api')||'';
    var v=prompt('Endereço do conector (deixe vazio para usar o seu PC):\n\nNa nuvem, cole a URL do Render, ex.: https://duolive-xxxx.onrender.com', atual);
    if(v===null) return;
    v=v.trim();
    try{ if(v) localStorage.setItem('ld-api', v); else localStorage.removeItem('ld-api'); }catch(e){}
    confere();
    // ja reenvia a conta da loja atual para o novo endereco
    if(typeof lojaSel!=='undefined' && lojaSel){ try{ postConta(ttDe(lojaSel)); }catch(e){} }
  };
  aviso.style.display='flex';
  confere();
  setInterval(confere, 3000);

  /* ===== Seletor de lojas (igual ao LiveDash): lista vem do Supabase; o @ do
     TikTok de cada loja fica salvo aqui; selecionar troca a conta no conector. ===== */
  var lojas=[];               // nomes das lojas (FIXAS, do Supabase — iguais p/ todos)
  var fixas={};               // { nome: {tiktok, shopee} }
  var lojaSel='';             // loja ativa
  var ehAdm=false;            // só o ADM pode editar/adicionar lojas
  function ttDe(l){ return (fixas[l]&&fixas[l].tiktok)||''; }
  function shDe(l){ return (fixas[l]&&fixas[l].shopee)||''; }

  function postConta(tt){
    // manda o @ (chat) e a loja (numeros do console) juntos
    try{ fetch(URL_MC+'/conta',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({tiktok:tt||'',loja:(typeof lojaSel!=='undefined'?lojaSel:'')})}).catch(function(){}); }catch(e){}
  }
  /* guarda as DUAS contas da loja no conector (elas aparecem no painel de Ofertas) */
  function postLoja(loja){
    try{ fetch(URL_MC+'/minha-loja',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({loja:loja,nome:loja,tiktok:ttDe(loja),shopee:shDe(loja)})}).catch(function(){}); }catch(e){}
  }
  /* só o ADM: guarda/apaga a loja no Supabase (vale para TODOS os aparelhos) */
  function salvarLoja(nome,tiktok,shopee){
    return fetch(URL_MC+'/lojas-fixas',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({nome:nome,tiktok:tiktok,shopee:shopee})}).then(function(r){return r.json();});
  }
  function apagarLoja(loja){
    if(!ehAdm){ alert('Só o ADM pode tirar lojas.'); return; }
    if(!confirm('Tirar a loja "'+loja+'" da lista? Isso vale para todos.')) return;
    fetch(URL_MC+'/lojas-fixas-remover',{method:'POST',headers:{'content-type':'application/json'},
      body:JSON.stringify({nome:loja})}).then(function(){
        if(lojaSel===loja){ lojaSel=''; try{ localStorage.removeItem('ld-loja-sel'); }catch(e){} }
        carregarLojas();
      }).catch(function(){});
  }
  function editarContas(loja){
    if(!ehAdm){ alert('Só o ADM pode editar as contas das lojas.'); return; }
    var tt=prompt('@ do TikTok da loja "'+loja+'"\n(a conta que faz a live — sem o @)', ttDe(loja));
    if(tt===null) return;
    var sh=prompt('Usuário da Shopee da loja "'+loja+'"\n(deixe em branco se não tiver)', shDe(loja));
    if(sh===null) sh=shDe(loja);
    salvarLoja(loja, tt.trim().replace(/^@/,''), sh.trim().replace(/^@/,'')).then(function(){
      carregarLojas();
      if(loja===lojaSel) postConta(ttDe(loja));
    });
  }
  function fechaMenu(){ document.getElementById('menuLojas').classList.remove('aberto'); }
  function selecionar(loja, automatico){
    lojaSel=loja;
    if(!automatico) escolhaManual=true; // voce escolheu na mao -> paro de trocar sozinho
    try{ localStorage.setItem('ld-loja-sel', loja); }catch(e){}
    postConta(ttDe(loja));
    postLoja(loja);
    var af=document.querySelector('.esq .caixa iframe');
    if(af) af.setAttribute('src','analytics.html?api='+encodeURIComponent(URL_MC)+'&loja='+encodeURIComponent(loja));
    // o multichat tambem e' POR loja: recarrega mostrando so' o chat desta loja
    try{ if(ligado) mc.src=URL_MC+'/'+(loja?'?loja='+encodeURIComponent(loja):''); }catch(e){}
    fechaMenu();
    renderLojas();
  }
  // como as duas contas aparecem: 🎵@tiktok · 🧡usuario-da-shopee
  function rotulo(loja){
    var p=[]; if(ttDe(loja)) p.push('🎵@'+ttDe(loja)); if(shDe(loja)) p.push('🧡'+shDe(loja));
    return p.length?p.join(' · '):'sem conta';
  }
  function renderLojas(){
    document.getElementById('lojaNome').textContent = lojaSel || 'escolher…';
    document.getElementById('lojaTT').textContent = lojaSel ? rotulo(lojaSel) : '';
    var menu=document.getElementById('menuLojas'); menu.innerHTML='';
    lojas.forEach(function(loja){
      var d=document.createElement('div'); d.className='item'+(loja===lojaSel?' on':'');
      var vivo=(typeof lojasLive!=='undefined' && lojasLive.indexOf(loja)>=0);
      // as engrenagens (editar/apagar) só aparecem para o ADM
      var edits = ehAdm ? '<span class="ed" title="Editar as contas (só ADM)">✎</span><span class="ed del" title="Tirar da lista (só ADM)">🗑</span>' : '';
      d.innerHTML=(vivo?'<span title="ao vivo" style="color:#f43f5e">●</span> ':'')+'<span class="nome"></span><span class="tt"></span>'+edits;
      d.querySelector('.nome').textContent=loja;
      d.querySelector('.tt').textContent=rotulo(loja);
      d.onclick=function(ev){
        if(ev.target.classList.contains('del')){ ev.stopPropagation(); apagarLoja(loja); return; }
        if(ev.target.classList.contains('ed')){ ev.stopPropagation(); editarContas(loja); return; }
        selecionar(loja);
      };
      menu.appendChild(d);
    });
    if(ehAdm){
      var add=document.createElement('div'); add.className='add'; add.textContent='+ adicionar loja';
      add.onclick=function(){
        var nome=(prompt('Nome da nova loja:','')||'').trim(); if(!nome) return;
        var tt=(prompt('@ do TikTok da loja "'+nome+'" (sem @):','')||'').trim().replace(/^@/,'');
        salvarLoja(nome, tt, '').then(function(){ carregarLojas(); selecionar(nome); });
      };
      menu.appendChild(add);
    }
  }
  document.getElementById('btnLoja').onclick=function(ev){
    ev.stopPropagation();
    document.getElementById('menuLojas').classList.toggle('aberto');
  };
  document.addEventListener('click', function(ev){
    if(!document.getElementById('barraLojas').contains(ev.target)) fechaMenu();
  });
  function carregarLojas(){
    // a lista FIXA de lojas (Supabase, igual p/ todos). O próprio conector diz se
    // quem está pedindo pode editar (ehAdm = ADM logado, ou o PC local).
    fetch(URL_MC+'/lojas-fixas',{cache:'no-store'}).then(function(r){return r.json();})
      .then(function(d){
        ehAdm=!!(d&&d.ehAdm);
        var arr=(d&&d.lojas)||[]; lojas=[]; fixas={};
        arr.forEach(function(l){ lojas.push(l.nome); fixas[l.nome]={tiktok:l.tiktok||'',shopee:l.shopee||''}; });
        renderLojas();
        var salva=''; try{ salva=localStorage.getItem('ld-loja-sel')||''; }catch(e){}
        if(salva && lojas.indexOf(salva)>=0) selecionar(salva, true);       // restaura a sua escolha
        else if(!lojaSel && lojas.length===1) selecionar(lojas[0], true);   // só uma loja: já entra nela
      })
      .catch(function(){ lojas=[]; fixas={}; renderLojas(); });
  }
  carregarLojas();

  // ===== detecta sozinho qual loja esta em live e foca nela =====
  var lojasLive=[];        // nomes das lojas ao vivo (do robo do console)
  var escolhaManual=false; // se voce escolheu na mao, nao troco sozinho
  function pegaLojasLive(){
    fetch(URL_MC+'/lojas-live',{cache:'no-store'}).then(function(r){return r.json();}).then(function(v){
      if(!Array.isArray(v)) return;
      lojasLive=v.filter(function(x){return x.live;}).map(function(x){return x.loja;});
      renderLojas(); // atualiza os pontinhos 🔴 no menu
      // foca sozinho na loja em live (se voce nao escolheu na mao e ela tem @ cadastrado)
      if(!escolhaManual && lojasLive.length){
        var alvo=lojasLive[0];
        if(alvo!==lojaSel && ttDe(alvo)){ selecionar(alvo, true); }
      }
    }).catch(function(){});
  }
  pegaLojasLive();
  setInterval(pegaLojasLive, 15000);

  // barrinha do meio: arrasta para aumentar/diminuir o Multichat (e fica salvo)
  var divisor=document.getElementById('divisor');
  try{
    var salvo=localStorage.getItem('ld-painel-esq');
    if(salvo) document.documentElement.style.setProperty('--esq', salvo);
  }catch(e){}
  divisor.addEventListener('pointerdown', function(ev){
    ev.preventDefault();
    divisor.setPointerCapture(ev.pointerId);
    document.body.classList.add('arrastando');
    function move(e){
      var larg=Math.max(300, Math.min(e.clientX-6, window.innerWidth*0.75));
      document.documentElement.style.setProperty('--esq', larg+'px');
    }
    function solta(){
      document.body.classList.remove('arrastando');
      divisor.removeEventListener('pointermove', move);
      divisor.removeEventListener('pointerup', solta);
      try{ localStorage.setItem('ld-painel-esq', document.documentElement.style.getPropertyValue('--esq')); }catch(e){}
    }
    divisor.addEventListener('pointermove', move);
    divisor.addEventListener('pointerup', solta);
  });
  // 2 cliques na barrinha: volta ao tamanho padrão
  divisor.addEventListener('dblclick', function(){
    document.documentElement.style.removeProperty('--esq');
    try{ localStorage.removeItem('ld-painel-esq'); }catch(e){}
  });

  // mostra quem está logado (nome + Sair + link do Histórico). Só aparece quando
  // há login de verdade (ex.: na nuvem); no PC local sem senha, fica escondido.
  fetch('/eu',{cache:'no-store'}).then(function(r){return r.json();}).then(function(u){
    if(u&&u.nome){
      var b=document.getElementById('euBarNome'); if(b) b.textContent=u.nome+(u.papel==='adm'?' · ADM':'');
      var e=document.getElementById('euBar'); if(e) e.style.display='flex';
      if(u.sigla) temaDoUsuario(u.sigla); // aplica o tema salvo DAQUELA pessoa (ex.: Alessandra = claro)
    }
  }).catch(function(){});

  // ===== alarme "COMPRA!" em TELA INTEIRA: o Multichat (iframe) avisa por postMessage
  //       e aqui a gente cobre o painel todo por ~4s a cada venda. =====
  (function(){
    var css=document.createElement('style');
    css.textContent="#compraFull{position:fixed;inset:0;z-index:99999;display:flex;align-items:center;justify-content:center;pointer-events:none;opacity:0;transition:opacity .25s}"
      +"#compraFull.on{opacity:1}"
      +"#compraFull .raios{position:absolute;width:160vmax;height:160vmax;border-radius:50%;background:repeating-conic-gradient(from 0deg,rgba(255,214,0,0) 0deg 6deg,rgba(255,214,0,.30) 6deg 12deg,rgba(255,0,0,0) 12deg 18deg,rgba(255,70,70,.24) 18deg 24deg);animation:ldGiraF 9s linear infinite}"
      +"#compraFull .miolo{position:relative;text-align:center;padding:0 16px}"
      +"#compraFull.on .miolo{animation:ldPopF .5s cubic-bezier(.2,1.4,.4,1)}"
      +"#compraFull .bang{font-family:'Arial Black',Arial,sans-serif;font-weight:900;font-size:min(24vw,300px);line-height:.9;color:#b00020;-webkit-text-stroke:8px #ffd600;text-shadow:0 8px 0 rgba(0,0,0,.15),0 0 40px rgba(255,70,70,.6);letter-spacing:-3px}"
      +"#compraFull .quemV{margin-top:14px;font-weight:800;font-size:min(5.5vw,52px);color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.75)}"
      +"#compraFull .valorV{margin-top:4px;font-weight:900;font-size:min(10vw,96px);color:#4ade80;text-shadow:0 3px 18px rgba(0,0,0,.8)}"
      +"@keyframes ldGiraF{to{transform:rotate(360deg)}}"
      +"@keyframes ldPopF{0%{transform:scale(.3);opacity:0}60%{transform:scale(1.08)}100%{transform:scale(1)}}";
    document.head.appendChild(css);
    var ov=document.createElement('div'); ov.id='compraFull';
    ov.innerHTML='<div class="raios"></div><div class="miolo"><div class="bang">COMPRA!</div><div class="quemV"></div><div class="valorV"></div></div>';
    document.body.appendChild(ov);
    var t=null;
    function mostra(quem,texto,plat){
      var m=String(texto||'').match(/R\$\s*[\d.,]+/);
      ov.querySelector('.valorV').textContent=m?m[0]:'';
      ov.querySelector('.quemV').textContent=(plat==='shopee'?'🧡 ':'🎵 ')+(quem||'Alguém')+' comprou';
      ov.classList.remove('on'); void ov.offsetWidth; ov.classList.add('on');
      clearTimeout(t); t=setTimeout(function(){ ov.classList.remove('on'); }, 4200);
    }
    window.addEventListener('message', function(ev){
      var d=ev&&ev.data; if(d&&d.tipo==='ld-compra') mostra(d.quem,d.texto,d.plat);
    });
  })();
})();
</script>
</body>
</html>
