<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DuoLive · Histórico de vendas</title>
<script>try{if(localStorage.getItem('ldTema')==='claro')document.documentElement.setAttribute('data-tema','claro');}catch(e){}</script>
<style>
  :root{--bg:#0d0d10;--card:#16161b;--card-2:#1d1d24;--line:#26262e;--text:#ececf1;--text-2:#a3a3ad;--text-3:#737373;--accent:#ff5c35;--ok:#4ade80}
  :root[data-tema=claro]{--bg:#f4f4f6;--card:#ffffff;--card-2:#eef0f3;--line:#e4e4ea;--text:#1a1a20;--text-2:#5c5c68;--text-3:#8b8b95}
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font:13px/1.5 -apple-system,'Segoe UI',Roboto,Arial,sans-serif;padding:16px;max-width:1100px;margin:0 auto}
  .topo{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:4px}
  h1{font-size:17px;flex:1;min-width:180px}
  .eu{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2)}
  .eu b{color:var(--text)}
  .sair{background:transparent;border:1px solid var(--line);color:var(--text-2);border-radius:7px;padding:5px 11px;font-size:12px;cursor:pointer}
  .sair:hover{border-color:var(--accent);color:var(--text)}
  .voltar{background:transparent;border:1px solid var(--line);color:var(--text-2);border-radius:7px;padding:5px 12px;font-size:12px;text-decoration:none;white-space:nowrap}
  .voltar:hover{border-color:var(--accent);color:var(--text)}
  .sub{font-size:11.5px;color:var(--text-3);margin-bottom:14px}
  .filtros{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}
  .chip{font-size:12px;padding:5px 14px;border-radius:99px;border:1px solid var(--line);color:var(--text-3);cursor:pointer;user-select:none;background:var(--card)}
  .chip.on{color:var(--text);border-color:var(--accent);background:rgba(255,92,53,.14)}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
  .card small{font-size:10.5px;color:var(--text-3);display:block}
  .card b{font-size:21px;font-variant-numeric:tabular-nums;letter-spacing:-.3px}
  .pessoas{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:18px}
  .pessoa{background:var(--card);border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:9px 13px;min-width:130px}
  .pessoa .nm{font-size:12.5px;font-weight:700;display:flex;align-items:center;gap:6px}
  .pessoa .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .pessoa .vl{font-size:17px;font-weight:800;font-variant-numeric:tabular-nums;margin-top:3px}
  .pessoa .qt{font-size:12px;color:var(--text-2);font-weight:700;margin-top:1px}
  .graf{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 8px 8px}
  .graf h2{font-size:12px;color:var(--text-2);font-weight:600;margin:0 8px 12px}
  .barras{display:flex;align-items:flex-end;gap:10px;height:230px;overflow-x:auto;padding:0 8px 4px}
  .col{flex:0 0 auto;width:44px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:5px}
  .col .val{font-size:10px;color:var(--text-2);font-variant-numeric:tabular-nums;white-space:nowrap}
  .stack{width:34px;display:flex;flex-direction:column-reverse;border-radius:5px 5px 0 0;overflow:hidden;min-height:3px}
  .seg{width:100%}
  .col .hora{font-size:9.5px;color:var(--text-3);text-align:center;line-height:1.25;white-space:nowrap}
  .legenda{display:flex;gap:12px;flex-wrap:wrap;margin:12px 8px 2px;font-size:11px;color:var(--text-2)}
  .legenda span{display:inline-flex;align-items:center;gap:5px}
  .legenda i{width:10px;height:10px;border-radius:2px;display:inline-block}
  .vazio{color:var(--text-3);font-size:12.5px;padding:26px 10px;text-align:center;line-height:1.7}
  .erro{display:none;background:var(--card);border:1px dashed var(--line);border-radius:12px;padding:16px;font-size:12.5px;color:var(--text-2)}
</style>
</head>
<body>
  <div class="topo">
    <a href="/painel" class="voltar">← Painel</a>
    <h1>📈 Histórico de vendas</h1>
    <div class="eu" id="eu" style="display:none">👤 <b id="euNome"></b> <button class="sair" onclick="location.href='/sair'">Sair</button></div>
  </div>
  <div class="sub" id="sub">Cada barra é uma <b>live</b> (pelo horário que ela começou). A cor mostra <b>quem vendeu</b>.</div>

  <div class="filtros" id="filtros">
    <span class="chip on" data-p="hoje">Hoje</span>
    <span class="chip" data-p="7">7 dias</span>
    <span class="chip" data-p="mes">Mês</span>
    <span class="chip" data-p="total">Total</span>
  </div>
  <div class="filtros" id="visoes" style="margin-top:2px">
    <span class="chip on" data-v="vend">👤 Vendedoras</span>
    <span class="chip" data-v="loja">🏪 Lojas</span>
    <span class="chip" data-v="metas" style="display:none">⏱️ Metas</span>
  </div>

  <div class="cards">
    <div class="card"><small>💰 Total no período</small><b id="cTotal" style="color:var(--ok)">R$ 0,00</b></div>
    <div class="card"><small>🛒 Vendas</small><b id="cQtd">0</b></div>
    <div class="card"><small>📺 Lives</small><b id="cLives">0</b></div>
  </div>

  <div class="pessoas" id="pessoas"></div>

  <div class="graf">
    <h2 id="grafTit">Vendas por live</h2>
    <div class="barras" id="barras"></div>
    <div class="legenda" id="legenda"></div>
    <div class="vazio" id="vazio" style="display:none"></div>
  </div>
  <div class="erro" id="erro">Não consegui carregar o histórico agora. Recarregue a página (F5).</div>

<script>
(function(){
  // F5 / reiniciar a página = sair (na nuvem, cada abertura pede login de novo)
  try{
    var _nav=(performance.getEntriesByType&&performance.getEntriesByType('navigation')[0]);
    var _recarregou=_nav?(_nav.type==='reload'):(performance.navigation&&performance.navigation.type===1);
    var _naNuvem=!/^(localhost$|127\.|0\.0\.0\.0|192\.168\.|10\.|172\.(1[6-9]|2\d|3[01])\.)/.test(location.hostname);
    if(_recarregou && _naNuvem){ location.replace('/sair'); return; }
  }catch(e){}
  var $=function(id){return document.getElementById(id)};
  var periodo='hoje', visao='vend', ehAdm=false, papel=null, minhaSigla=null;
  // início do período pedido (em horário local, pra o mês fechar certo no fuso do Brasil)
  function desdeDe(p){
    var d=new Date();
    if(p==='hoje'){ d.setHours(0,0,0,0); return d; }
    if(p==='mes'){ return new Date(d.getFullYear(), d.getMonth(), 1); }   // 1º dia do mês atual
    if(p==='total'){ return new Date(2000,0,1); }                          // tudo, desde sempre
    d.setDate(d.getDate()-7); return d;                                    // 7 dias
  }
  function real(n){ return 'R$ '+(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
  function corDe(cores,sig){ if(sig==='LIVE 10K') return '#f59e0b'; return (sig&&cores[sig]&&cores[sig].cor)||'#6b7280'; }
  function nomeDe(cores,sig){ if(!sig) return 'sem vendedora'; return (cores[sig]&&cores[sig].nome)||sig; }
  function quando(ms){ var d=new Date(ms); return ('0'+d.getDate()).slice(-2)+'/'+('0'+(d.getMonth()+1)).slice(-2)+' '+('0'+d.getHours()).slice(-2)+':'+('0'+d.getMinutes()).slice(-2); }

  // quem está logado (nome + Sair)
  fetch('/eu',{cache:'no-store'}).then(function(r){return r.json();}).then(function(u){
    if(u&&u.nome){ $('euNome').textContent=u.nome+(u.papel==='adm'?' (ADM)':''); $('eu').style.display=''; }
  }).catch(function(){});

  $('filtros').addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c) return;
    periodo=c.dataset.p;
    document.querySelectorAll('#filtros .chip').forEach(function(x){ x.classList.toggle('on',x===c); });
    carregar();
  });
  $('visoes').addEventListener('click',function(e){
    var c=e.target.closest('.chip'); if(!c) return;
    visao=c.dataset.v;
    document.querySelectorAll('#visoes .chip').forEach(function(x){ x.classList.toggle('on',x===c); });
    ajustaPeriodos();
    carregar();
  });
  // Metas não tem "Total" (meta de horas no acumulado não faz sentido) — some com o botão
  function ajustaPeriodos(){
    var tot=document.querySelector('#filtros .chip[data-p="total"]');
    if(visao==='metas'){
      if(tot) tot.style.display='none';
      if(periodo==='total'){ periodo='mes'; document.querySelectorAll('#filtros .chip').forEach(function(x){ x.classList.toggle('on',x.dataset.p==='mes'); }); }
    } else if(tot){ tot.style.display=''; }
  }

  function carregar(){
    if(visao==='metas'){ carregarMetas(); return; }
    fetch('/vendas-historico?desde='+encodeURIComponent(desdeDe(periodo).toISOString()),{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
      if(!d||!d.ok){ $('erro').style.display='block'; return; }
      $('erro').style.display='none';
      ehAdm=!!d.ehAdm; papel=d.papel; minhaSigla=d.minhaSigla;
      var _mc=document.querySelector('#visoes .chip[data-v="metas"]'); if(_mc) _mc.style.display=ehAdm?'':'none';
      $('sub').innerHTML = (visao==='loja')
        ? 'Cada barra/cartão é uma <b>loja</b> — o total de vendas dela no período.'
        : (papel==='vendedora')
          ? 'Você vê só as <b>suas</b> vendas. Cada barra é uma <b>live</b> (pelo horário que começou).'
          : 'Cada barra é uma <b>vendedora</b> — o total dela no período (Hoje · 7 dias · Mês · Total).';
      var vendas=d.vendas||[], cores=d.cores||{};
      if(visao==='loja'){
        // trata a LOJA como se fosse a "sigla" -> o gráfico/cartões já funcionam, por loja
        var LC={monaco:{nome:'Monaco',cor:'#ff5c35'},bellini:{nome:'Bellini',cor:'#f472b6'},fast:{nome:'Fast',cor:'#38bdf8'},mania:{nome:'Mania',cor:'#4ade80'}};
        vendas=vendas.map(function(v){ return {valor:v.valor,sigla:v.loja||'(sem loja)',produto:v.produto,ts:v.ts,qtd:v.qtd}; });
        cores={}; vendas.forEach(function(v){ if(!cores[v.sigla]) cores[v.sigla]=LC[v.sigla]||{nome:v.sigla.charAt(0).toUpperCase()+v.sigla.slice(1),cor:'#8b8b95'}; });
      }
      render(vendas, cores);
    }).catch(function(){ $('erro').style.display='block'; });
  }

  function render(vendas, cores){
    // rótulos dos cartões voltam ao normal (o modo Metas troca eles)
    $('cTotal').previousElementSibling.textContent='💰 Total no período';
    $('cQtd').previousElementSibling.textContent='🛒 Vendas';
    $('cLives').previousElementSibling.textContent='📺 Lives';
    // LIVE 10K é evento TEMPORÁRIO: aparece nos períodos recentes (Hoje/7/Mês),
    // mas NÃO entra no "Total" (que é o acumulado permanente).
    if(periodo==='total'){ vendas=vendas.filter(function(v){ return v.sigla!=='LIVE 10K' && v.produto!=='LIVE 10K'; }); } // LIVE 10K dividido em TS/AL fica marcado por produto
    var total=0, qtd=0;
    // por pessoa (sigla)
    var porSig={};
    // por live (agrupa pelo ts = início da live), e dentro dela por sigla
    var porLive={};
    vendas.forEach(function(v){
      var val=+v.valor||0; total+=val;
      // venda = PEDIDO: no espelho do LiveDash cada linha é uma LIVE e traz
      // qtd = nº de pedidos dela; no banco próprio cada linha é 1 pedido (qtd=1)
      var n=(+v.qtd>=0 && v.qtd!=null)?+v.qtd:1; qtd+=n;
      var sig=v.sigla||'';
      if(!porSig[sig]) porSig[sig]={sig:sig,total:0,qtd:0}; porSig[sig].total+=val; porSig[sig].qtd+=n;
      var k=v.ts||'?';
      if(!porLive[k]) porLive[k]={ts:new Date(v.ts).getTime(),total:0,qtd:0,porSig:{}};
      porLive[k].total+=val; porLive[k].qtd+=n;
      porLive[k].porSig[sig]=(porLive[k].porSig[sig]||0)+val;
    });
    var lives=Object.keys(porLive).map(function(k){return porLive[k];}).sort(function(a,b){return a.ts-b.ts;});

    $('cTotal').textContent=real(total);
    $('cQtd').textContent=qtd;
    $('cLives').textContent=lives.length;

    // cartões por pessoa (ADM vê todas; vendedora vê só a dela). Ordena por total.
    var pess=Object.keys(porSig).map(function(s){return porSig[s];}).sort(function(a,b){return b.total-a.total;});
    var pe=$('pessoas'); pe.innerHTML='';
    pess.forEach(function(p){
      var cor=corDe(cores,p.sig);
      var d=document.createElement('div'); d.className='pessoa'; d.style.borderLeftColor=cor;
      d.innerHTML='<div class="nm"><span class="dot" style="background:'+cor+'"></span>'+nomeDe(cores,p.sig)+(p.sig?(' ('+p.sig+')'):'')+'</div>'
        +'<div class="vl">'+real(p.total)+'</div><div class="qt">'+p.qtd+' venda'+(p.qtd===1?'':'s')+'</div>';
      pe.appendChild(d);
    });

    // ===== gráfico =====
    var barras=$('barras'); barras.innerHTML='';
    var semDados = ehAdm ? !pess.length : !lives.length;
    if(semDados){
      barras.style.display='none'; $('legenda').style.display='none';
      $('vazio').style.display='';
      $('vazio').innerHTML = (papel==='vendedora')
        ? 'Nenhuma venda sua neste período ainda.<br>Assim que você fizer uma live logada, ela aparece aqui.'
        : 'Nenhuma venda registrada neste período ainda.<br>Assim que o robô pegar a primeira venda de uma live, ela aparece aqui.';
      return;
    }
    barras.style.display=''; $('vazio').style.display='none';

    if(ehAdm){
      // ADM: uma barra POR VENDEDORA (total no período — Hoje / 7 dias / 30 dias)
      $('grafTit').textContent='Total por vendedora no período';
      $('legenda').style.display='none';
      var maxP=Math.max.apply(null, pess.map(function(p){return p.total;}))||1;
      pess.forEach(function(p){
        var cor=corDe(cores,p.sig);
        var altura=Math.max(3, Math.round(p.total/maxP*190));
        var col=document.createElement('div'); col.className='col';
        col.innerHTML='<div class="val">'+real(p.total).replace('R$ ','')+'</div>'
          +'<div class="stack" style="height:'+altura+'px"><div class="seg" style="height:'+altura+'px;background:'+cor+'"></div></div>'
          +'<div class="hora">'+(p.sig||'sem vend.')+'</div>';
        col.title=nomeDe(cores,p.sig)+' · '+real(p.total)+' · '+p.qtd+' venda(s)';
        barras.appendChild(col);
      });
      return;
    }

    // vendedora: uma barra POR LIVE (empilhada por sigla)
    $('grafTit').textContent='Vendas por live';
    $('legenda').style.display='flex';
    var maxT=Math.max.apply(null, lives.map(function(l){return l.total;}))||1;
    lives.forEach(function(l){
      var col=document.createElement('div'); col.className='col';
      var altura=Math.max(3, Math.round(l.total/maxT*190)); // px da coluna cheia
      var stack='';
      Object.keys(l.porSig).sort(function(a,b){return l.porSig[b]-l.porSig[a];}).forEach(function(sig){
        var h=Math.round(l.porSig[sig]/l.total*altura);
        stack+='<div class="seg" style="height:'+h+'px;background:'+corDe(cores,sig)+'"></div>';
      });
      col.innerHTML='<div class="val">'+real(l.total).replace('R$ ','')+'</div>'
        +'<div class="stack" style="height:'+altura+'px">'+stack+'</div>'
        +'<div class="hora">'+quando(l.ts).replace(' ','<br>')+'</div>';
      col.title=quando(l.ts)+' · '+real(l.total)+' · '+l.qtd+' venda(s)';
      barras.appendChild(col);
    });
    var leg=$('legenda'); leg.innerHTML='';
    pess.forEach(function(p){
      var s=document.createElement('span');
      s.innerHTML='<i style="background:'+corDe(cores,p.sig)+'"></i>'+nomeDe(cores,p.sig);
      leg.appendChild(s);
    });
  }

  // ===== modo METAS (horas de live por vendedora, vs a meta do período) =====
  function fmtH(min){ min=Math.max(0,Math.round(+min||0)); return Math.floor(min/60)+'h'+('0'+(min%60)).slice(-2); }
  function carregarMetas(){
    fetch('/horas-vendedoras?periodo='+encodeURIComponent(periodo),{cache:'no-store'})
      .then(function(r){return r.json();}).then(function(d){
        if(!d||!d.ok){ $('erro').style.display='block'; return; }
        $('erro').style.display='none';
        var nomePer={hoje:'hoje','7':'nos últimos 7 dias',mes:'neste mês',total:'no total'}[periodo]||'no período';
        $('sub').innerHTML='Meta de <b>horas de live</b> por vendedora — '+nomePer+'. Meta do período: <b>'+fmtH(d.metaMin)+'</b> ('+fmtH(d.metaDia)+'/dia × '+d.dias+' dia'+(d.dias===1?'':'s')+').';
        renderMetas(d);
      }).catch(function(){ $('erro').style.display='block'; });
  }
  function renderMetas(d){
    var vend=d.vendedoras||[], metaMin=d.metaMin||240;
    var bateram=vend.filter(function(v){return (+v.minutos||0)>=metaMin;}).length;
    var somaMin=vend.reduce(function(a,v){return a+(+v.minutos||0);},0);
    $('cTotal').textContent=fmtH(metaMin); $('cTotal').previousElementSibling.textContent='🎯 Meta do período';
    $('cQtd').textContent=bateram+'/'+vend.length; $('cQtd').previousElementSibling.textContent='✅ Bateram a meta';
    $('cLives').textContent=fmtH(somaMin); $('cLives').previousElementSibling.textContent='⏱️ Horas somadas';
    var pe=$('pessoas'); pe.innerHTML='';
    vend.forEach(function(v){
      var falta=metaMin-(+v.minutos||0), ok=falta<=0, cor=v.cor||'#6b7280';
      var msg=ok?('Meta concluída! Horas realizadas: '+fmtH(v.minutos)):('Falta '+fmtH(falta)+' para bater a meta diária!');
      var el=document.createElement('div'); el.className='pessoa'; el.style.borderLeftColor=cor;
      el.innerHTML='<div class="nm"><span class="dot" style="background:'+cor+'"></span>'+(v.nome||v.sigla)+' ('+v.sigla+')</div>'
        +'<div class="vl">'+fmtH(v.minutos)+' <span style="font-size:12px;color:var(--text-3)">/ '+fmtH(metaMin)+'</span></div>'
        +'<div class="qt" style="color:'+(ok?'#22c55e':'#ef4444')+';font-weight:800">'+msg+'</div>';
      pe.appendChild(el);
    });
    $('grafTit').textContent='Horas de live por vendedora'; $('legenda').style.display='none';
    var barras=$('barras');
    if(!vend.length){ barras.style.display='none'; $('vazio').style.display=''; $('vazio').textContent='Nenhuma vendedora cadastrada.'; return; }
    barras.style.display=''; $('vazio').style.display='none'; barras.innerHTML='';
    var maxV=Math.max.apply(null, vend.map(function(v){return +v.minutos||0;}).concat([metaMin]))||1;
    vend.forEach(function(v){
      var ok=(+v.minutos||0)>=metaMin, cor=ok?'#22c55e':(v.cor||'#6b7280');
      var altura=Math.max(3, Math.round((+v.minutos||0)/maxV*190));
      var col=document.createElement('div'); col.className='col';
      col.innerHTML='<div class="val">'+fmtH(v.minutos)+'</div>'
        +'<div class="stack" style="height:'+altura+'px"><div class="seg" style="height:'+altura+'px;background:'+cor+'"></div></div>'
        +'<div class="hora">'+v.sigla+'</div>';
      col.title=(v.nome||v.sigla)+' · '+fmtH(v.minutos)+' de '+fmtH(metaMin)+(ok?' ✅':'');
      barras.appendChild(col);
    });
  }

  carregar();
  setInterval(carregar, 30000); // atualiza sozinho a cada 30s
})();
</script>
</body>
</html>
