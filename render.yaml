# DuoLive · Deploy do painel/conector no Render (no ar 24h)
#
# Como usar (uma vez):
#  1. No Render: New +  ->  Blueprint  ->  conecte o repositorio DEV-SOFISTICASA/duolive
#  2. Ele le este arquivo e cria o servico. Preencha as variaveis marcadas "sync: false":
#       DUOLIVE_SENHA_PAINEL = a senha para entrar no painel (ex.: 01061705)
#       DUOLIVE_TOKEN        = um cracha secreto qualquer (o robo do PC usa o MESMO)
#       DUOLIVE_SIGN_KEY     = sua chave do eulerstream.com (chat do TikTok)
#       DUOLIVE_TIKTOK_USER  = o @ da conta do TikTok (sem @) — opcional
#  3. Deploy. Copie a URL publica (algo como https://duolive-conector.onrender.com)
#  4. No PC, no arquivo conector/conector.txt, ponha:
#       1a linha: a URL do Render
#       2a linha: o MESMO valor de DUOLIVE_TOKEN
#     Assim o robo manda as vendas para a nuvem.
services:
  - type: web
    name: duolive-conector
    runtime: node
    plan: starter          # always-on (24h). O "free" dorme apos 15 min sem acesso.
    rootDir: conector
    buildCommand: npm install
    startCommand: node duolive-conector.js
    healthCheckPath: /saude # responde sempre, sem senha
    envVars:
      - key: DUOLIVE_SENHA_PAINEL
        sync: false          # a senha do painel (voce preenche no painel do Render)
      - key: DUOLIVE_TOKEN
        sync: false          # cracha secreto; o robo do PC usa o mesmo
      - key: DUOLIVE_SIGN_KEY
        sync: false          # chave do eulerstream.com (chat do TikTok)
      - key: DUOLIVE_TIKTOK_USER
        sync: false          # o @ da conta do TikTok, sem o @ (opcional)
      - key: SUPABASE_URL
        sync: false          # https://XXXX.supabase.co (do projeto duolive)
      - key: SUPABASE_KEY
        sync: false          # a chave SECRETA (service_role) do Supabase
      - key: LIVEDASH_URL
        sync: false          # Supabase ANTIGO do LiveDash (o histórico é espelho de lá)
      - key: LIVEDASH_KEY
        sync: false          # service_role do projeto antigo (mesma do worker livedash-robo)

  # (O worker "duolive-robo" — robô de vendas na nuvem — foi REMOVIDO em 2026-08-22:
  #  o robô roda no PC RESERVA, e o da nuvem brigava com ele pelas mesmas sessões.
  #  Se o serviço ainda existir no painel do Render, suspenda/apague o worker lá.)
